<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spanisch-Lernzentrale</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EDF3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#091822" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spanisch">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
@font-face { font-family: 'Fraunces'; font-style: normal; font-weight: 100 900; font-display: swap; src: url(fonts/fraunces-latin-wght-normal.woff2) format('woff2'); }
@font-face { font-family: 'Fraunces'; font-style: italic; font-weight: 100 900; font-display: swap; src: url(fonts/fraunces-latin-wght-italic.woff2) format('woff2'); }
@font-face { font-family: 'Atkinson Hyperlegible Next'; font-style: normal; font-weight: 200 800; font-display: swap; src: url(fonts/atkinson-hyperlegible-next-latin-wght-normal.woff2) format('woff2'); }
</style>
<style>
:root {
  /* Idee: Gletscherlicht und Sol de Mayo. Kühle, helle Flächen, tiefes Seeblau für Aktionen, Sonnengold für Fortschritt.
     Spanische Wörter stehen wie Wörterbuch-Stichwörter in einer Serifenschrift, die Bedienung in einer klaren Grotesk. */
  --bg: #EDF3F6; --surface: #FFFFFF; --ink: #0E2433; --muted: #557082; --line: #D2DEE6;
  --accent: #0B6A94; --on-accent: #FFFFFF; --accent-soft: #D8EAF3;
  --sun: #E7A21D; --sun-soft: #FBEBC6; --hl: #8A5200;
  --good: #1B7F53; --warn: #A66A00; --bad: #B93A26; --good-soft: #D9F0E4; --bad-soft: #F8DDD6;
  --display: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --body: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 14px; --shadow: 0 1px 2px rgba(14, 36, 51, .06), 0 6px 18px rgba(14, 36, 51, .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #091822; --surface: #11283A; --ink: #E5EEF4; --muted: #8FA9BA; --line: #233F51;
    --accent: #62BDE6; --on-accent: #052030; --accent-soft: #173A4E;
    --sun: #F3BF4C; --sun-soft: #3A2F12; --hl: #F3BF4C;
    --good: #55C993; --warn: #E3AB4F; --bad: #F08A76; --good-soft: #123A2A; --bad-soft: #45201A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #091822; --surface: #11283A; --ink: #E5EEF4; --muted: #8FA9BA; --line: #233F51;
  --accent: #62BDE6; --on-accent: #052030; --accent-soft: #173A4E;
  --sun: #F3BF4C; --sun-soft: #3A2F12; --hl: #F3BF4C;
  --good: #55C993; --warn: #E3AB4F; --bad: #F08A76; --good-soft: #123A2A; --bad-soft: #45201A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); display: flex; flex-direction: column; -webkit-text-size-adjust: 100%; }
#view { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; width: 100%; max-width: 580px; margin: 0 auto; padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 14px; }
#view > * { flex: 0 0 auto; }
h1, h2, h3, h4, p, ul, ol { margin: 0; }
h1 { font: 600 26px/1.15 var(--display); text-wrap: balance; letter-spacing: -.01em; }
h2 { font: 700 17px/1.3 var(--body); text-wrap: balance; }
h3 { font: 700 16px/1.3 var(--body); }
h4 { font: 700 13px/1.3 var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 6px; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; -webkit-tap-highlight-color: transparent; }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
a { color: var(--accent); }
.muted { color: var(--muted); } .small { font-size: 14px; } .center { text-align: center; align-self: center; } .pad { padding: 8px 2px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Navigation */
#tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 4px max(4px, calc((100% - 580px) / 2)) calc(4px + env(safe-area-inset-bottom)); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 2px 5px; font-size: 11.5px; font-weight: 600; color: var(--muted); border-radius: 10px; }
.tab.on { color: var(--accent); }
body.focus #tabs { display: none; }
body.focus #view { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
#view { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
button, a, input, .task { touch-action: manipulation; }

/* Flächen */
.card { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.card.soft { background: var(--accent-soft); box-shadow: none; }
.vh { display: flex; gap: 10px; align-items: flex-start; }
.vh > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.sec { margin-top: 8px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; } .row > * { flex: 1 1 140px; }
.note { background: var(--sun-soft); border-radius: 10px; padding: 10px 12px; font-size: 14.5px; }
.card.warnbox { background: var(--sun-soft); box-shadow: none; border: 1.5px solid var(--sun); }
.steps { list-style: decimal; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; font-size: 15.5px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.chip { display: inline-block; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); }
.chip.sunny { background: var(--sun-soft); }
.badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--sun); color: #1B1300; letter-spacing: .04em; vertical-align: middle; }

/* Knöpfe */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 700; text-align: center; }
.btn.big { min-height: 54px; font-size: 17px; width: 100%; }
.btn.ghost { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.danger { background: var(--bad); color: #fff; }
.linkbtn { color: var(--accent); font-weight: 700; padding: 8px 4px; text-decoration: underline; text-underline-offset: 3px; }
.iconbtn { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); flex: none; }
.chipbtn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--line); background: var(--surface); font-weight: 700; font-size: 14px; }
.chipbtn .ic { width: 16px; height: 16px; }
.stepbtn { width: 38px; height: 38px; border-radius: 10px; box-shadow: inset 0 0 0 1.5px var(--line); background: var(--surface); font-size: 20px; font-weight: 700; line-height: 1; }
.spk { display: none; width: 36px; height: 36px; place-items: center; border-radius: 50%; color: var(--accent); vertical-align: middle; margin-left: 4px; flex: none; }
body.can-speak .spk { display: inline-grid; }
body.can-speak .nospeak, body:not(.can-speak) .speakonly { display: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); border-radius: 12px; padding: 4px; box-shadow: inset 0 0 0 1px var(--line); }
.seg button { padding: 9px 6px; border-radius: 9px; font-weight: 700; font-size: 14.5px; color: var(--muted); }
.seg button.on { background: var(--accent); color: var(--on-accent); }
.toggle { width: 52px; height: 30px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.toggle i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); transition: transform .15s; }
.toggle.on { background: var(--accent); } .toggle.on i { transform: translateX(22px); }
.inp, .ta { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 48px; }
.inp.narrow { width: auto; min-width: 150px; }
.ta { resize: vertical; font-size: 14px; }
.inp:focus, .ta:focus { outline: none; border-color: var(--accent); }

/* Heute */
.hero { display: grid; grid-template-columns: 124px 1fr; gap: 14px; align-items: center; }
.dial { position: relative; width: 124px; height: 124px; }
.sun { width: 100%; height: 100%; display: block; }
.ray { stroke: var(--line); stroke-width: 3.2; stroke-linecap: round; transition: stroke .4s; }
.ray.lit { stroke: var(--sun); }
.disc { fill: var(--surface); stroke: var(--line); stroke-width: 6; }
.arc { fill: none; stroke: var(--sun); stroke-width: 6; stroke-linecap: round; transition: stroke-dasharray .6s; }
.sun.full .disc { fill: var(--sun-soft); }
.dial-n { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; }
.dial-n b { font: 600 26px var(--display); font-variant-numeric: tabular-nums; } .dial-n span { font-size: 11px; color: var(--muted); font-weight: 600; }
.hero-t { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tasks { display: flex; flex-direction: column; gap: 8px; }
.task { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--surface); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); width: 100%; }
.task .chk { width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line); display: grid; place-items: center; color: transparent; }
.task.done .chk { background: var(--sun); box-shadow: none; color: #1B1300; }
.task.done { box-shadow: none; background: transparent; outline: 1px solid var(--line); }
.task.done b { text-decoration: line-through; text-decoration-color: var(--muted); color: var(--muted); }
.t-main { display: flex; flex-direction: column; min-width: 0; } .t-main small { color: var(--muted); font-size: 13.5px; }
.t-min { font-weight: 700; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.onb { display: flex; flex-direction: column; gap: 14px; padding-top: 12px; } .onb h1 { font-size: 30px; }
.plain { display: flex; flex-direction: column; gap: 6px; font-size: 15px; } .plain li { padding-left: 16px; position: relative; } .plain li::before { content: ''; position: absolute; left: 0; top: .6em; width: 7px; height: 7px; border-radius: 50%; background: var(--sun); }

/* Karten */
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stats3 b { display: block; font: 600 26px/1.1 var(--display); font-variant-numeric: tabular-nums; } .stats3 span { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.bar { display: block; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; min-width: 40px; flex: 1; } .bar i { display: block; height: 100%; background: var(--sun); border-radius: 99px; }
.bar.thin { height: 6px; }
.decks { display: flex; flex-direction: column; gap: 6px; } .decks li { display: flex; gap: 6px; align-items: stretch; }
.deck { flex: 1; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(40px, 1fr) auto; gap: 10px; align-items: center; background: var(--surface); border-radius: 12px; padding: 12px 14px; text-align: left; min-width: 0; }
.d-name { font-weight: 700; overflow-wrap: anywhere; } .d-n { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pinbtn { width: 46px; border-radius: 12px; background: var(--surface); display: grid; place-items: center; color: var(--line); flex: none; }
.pinbtn.on { color: var(--sun); } .pinbtn.on .ic { fill: var(--sun); }
.clist { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r); overflow: hidden; }
.clist li + li { border-top: 1px solid var(--line); }
.crow { display: grid; grid-template-columns: 12px minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: baseline; width: 100%; text-align: left; padding: 11px 14px; }
.c-es { font: 600 16.5px var(--display); overflow-wrap: anywhere; } .c-de { color: var(--muted); font-size: 14.5px; overflow-wrap: anywhere; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--line); align-self: center; }
.dot.learn { background: var(--sun); } .dot.young { background: var(--accent); } .dot.mature { background: var(--good); } .dot.known { background: var(--muted); }
.art.m { color: var(--accent); } .art.f { color: var(--hl); }

/* Lernkarte und Übung */
.sbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.fc, .dq { flex: 1 0 auto !important; display: flex; flex-direction: column; gap: 12px; background: var(--surface); border-radius: 20px; padding: 22px 20px; box-shadow: var(--shadow); }
.hw { font: 600 clamp(30px, 8.5vw, 44px)/1.12 var(--display); letter-spacing: -.015em; overflow-wrap: anywhere; }
.hw.de { font-family: var(--body); font-weight: 700; font-size: clamp(24px, 6.5vw, 32px); letter-spacing: 0; }
.fc hr { border: 0; border-top: 1px dashed var(--line); margin: 4px 0; width: 100%; }
.tr { font-size: 21px; font-weight: 600; } .tr.es { font: 600 28px/1.2 var(--display); }
.ex { display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; align-items: center; } .ex .de { grid-column: 1 / -1; }
.es { font-family: var(--display); font-size: 18px; font-style: italic; } .de { color: var(--muted); font-size: 15px; }
.cnote { font-size: 14.5px; background: var(--accent-soft); border-radius: 10px; padding: 9px 12px; }
.forms { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 15px; }
.form i { font-style: normal; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.form { background: var(--sun-soft); padding: 3px 9px; border-radius: 8px; font-family: var(--display); }
.fbar, .sticky { display: flex; flex-direction: column; gap: 8px; position: sticky; bottom: 0; padding: 12px 0 calc(4px + env(safe-area-inset-bottom)); background: linear-gradient(to bottom, transparent, var(--bg) 22%); z-index: 2; }
.rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; } .rate.two { grid-template-columns: 1fr 1fr; }
.rb { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 10px 2px; min-height: 58px; justify-content: center; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--line); }
.rb b { font-size: 14.5px; } .rb small { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rb.again { box-shadow: inset 0 0 0 2px var(--bad); } .rb.hard { box-shadow: inset 0 0 0 2px var(--warn); } .rb.good { box-shadow: inset 0 0 0 2px var(--good); background: var(--good-soft); } .rb.easy { box-shadow: inset 0 0 0 2px var(--accent); }
.ask { display: flex; gap: 8px; flex-wrap: wrap; }
.q { font: 600 22px/1.3 var(--display); overflow-wrap: anywhere; }
.gap { display: inline-block; min-width: 64px; border-bottom: 2.5px solid var(--sun); text-align: center; color: var(--hl); padding: 0 4px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.opt { min-height: 52px; border-radius: 12px; box-shadow: inset 0 0 0 2px var(--line); background: var(--surface); font: 600 19px var(--display); padding: 8px; }
.opt.ok { box-shadow: inset 0 0 0 2px var(--good); background: var(--good-soft); opacity: 1; } .opt.bad { box-shadow: inset 0 0 0 2px var(--bad); background: var(--bad-soft); opacity: 1; }
.ansf { margin: 0; } .ans { font: 600 21px var(--display); }
.ans.ok { border-color: var(--good); background: var(--good-soft); } .ans.near { border-color: var(--warn); background: var(--sun-soft); } .ans.bad { border-color: var(--bad); background: var(--bad-soft); }
.acc { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; } .acc button { min-height: 40px; border-radius: 9px; background: var(--accent-soft); font: 600 18px var(--display); }
.fb { border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; } .fb.ok { background: var(--good-soft); } .fb.near { background: var(--sun-soft); } .fb.bad { background: var(--bad-soft); }
.fb .es { font-style: normal; font-weight: 600; font-size: 21px; }
.sol { display: flex; align-items: center; gap: 4px; } .sol .es { font-style: normal; font-weight: 600; font-size: 22px; }
.endv { display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; padding-top: 16px; } .endv .sun { width: 120px; height: 120px; } .endv .row { width: 100%; } .endv h2 { margin-top: 8px; }
.wrong { width: 100%; text-align: left; background: var(--surface); border-radius: var(--r); } .wrong li { padding: 10px 14px; display: flex; flex-direction: column; font-size: 14.5px; color: var(--muted); } .wrong li + li { border-top: 1px solid var(--line); } .wrong b { font: 600 17px var(--display); color: var(--ink); }

/* Grammatik */
.lessons { display: flex; flex-direction: column; gap: 6px; }
.lesson { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border-radius: 12px; padding: 12px 14px; }
.lesson.next { box-shadow: inset 0 0 0 2px var(--sun); }
.l-n { font: 600 19px var(--display); color: var(--muted); width: 26px; text-align: center; font-variant-numeric: tabular-nums; }
.l-t { display: flex; flex-direction: column; min-width: 0; grid-column: auto; } .l-t small { color: var(--muted); font-size: 13.5px; }
.lesson > .l-t:first-child { grid-column: 1 / 3; }
.st { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--line); white-space: nowrap; }
.st.learn { background: var(--sun-soft); } .st.young { background: var(--accent-soft); } .st.mature { background: var(--good-soft); color: var(--good); }
.lesson-body { display: flex; flex-direction: column; gap: 14px; } .lesson-body > p { max-width: 62ch; }
.lesson-body ul:not(.exs) { display: flex; flex-direction: column; gap: 7px; padding-left: 18px; list-style: disc; } .lesson-body li::marker { color: var(--sun); }
.tip { background: var(--sun-soft); border-radius: 12px; padding: 12px 14px; }
.tw { overflow-x: auto; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
caption { text-align: left; padding: 10px 12px 2px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
th, td { text-align: left; padding: 8px 12px; vertical-align: top; } tbody tr + tr > * { border-top: 1px solid var(--line); }
thead th { font-size: 13px; color: var(--muted); border-bottom: 1.5px solid var(--line); white-space: nowrap; }
.conj tbody th { font-weight: 400; color: var(--muted); font-size: 13.5px; white-space: nowrap; } .conj td { font: 600 16.5px var(--display); white-space: nowrap; } .conj thead th { font: 600 15px var(--display); color: var(--ink); }
.conj td.irr { color: var(--hl); background: var(--sun-soft); } .conj tr.dim td, .conj tr.dim th { opacity: .45; }
.exs { display: flex; flex-direction: column; gap: 0; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 0 !important; list-style: none !important; }
.exs li { display: grid; grid-template-columns: 1fr auto; gap: 0 6px; align-items: center; padding: 10px 14px; } .exs li + li { border-top: 1px solid var(--line); } .exs .de { grid-column: 1 / -1; }
.card .exs { box-shadow: none; background: transparent; } .card .exs li { padding: 8px 0; }

/* Praxis und Fortschritt */
.res { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 12px; border-radius: 12px; box-shadow: inset 0 0 0 1.5px var(--line); text-decoration: none; color: var(--ink); }
.res span { display: flex; flex-direction: column; min-width: 0; } .res small { color: var(--muted); font-size: 13px; } .res .ic { color: var(--accent); width: 18px; height: 18px; }
.counter { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15px; } .counter b { font: 600 24px var(--display); min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; }

// ---------- Zusammenführen zweier Stände (z. B. Handy und Laptop) ----------
function mergeStates(L, R) {
  const M = freshState();
  M.created = Math.min(L.created || nowMs(), R.created || nowMs());
  M.at = Math.max(L.at || 0, R.at || 0);
  const newer = (L.set.at || 0) >= (R.set.at || 0) ? L : R, older = newer === L ? R : L;
  M.set = Object.assign({}, older.set, newer.set);
  M.ad = newer.ad; M.pri = newer.pri;
  M.li = {lt: Math.max(L.li.lt || 0, R.li.lt || 0), level: newer.li.level, fb: newer.li.fb};
  const keys = (a, b) => Array.from(new Set(Object.keys(a).concat(Object.keys(b))));
  keys(L.cards, R.cards).forEach(k => {
    const a = L.cards[k], b = R.cards[k];
    M.cards[k] = !a ? b : !b ? a : ((a[2] || 0) > (b[2] || 0) ? a : (a[2] || 0) < (b[2] || 0) ? b : (a[8] >= b[8] ? a : b));

  keys(L.days, R.days).forEach(k => {
    const a = L.days[k], b = R.days[k];
    if (!a || !b) { M.days[k] = a || b; return; }
    const o = {}; keys(a, b).forEach(f => { o[f] = Math.max(a[f] || 0, b[f] || 0); }); M.days[k] = o;
  });
  keys(L.gr, R.gr).forEach(k => {

    const ses = {}; (a.ses || []).concat(b.ses || []).forEach(x => { if (!ses[x[0]] || ses[x[0]][1] < x[1]) ses[x[0]] = x; });
    M.gr[k] = {st: Math.max(a.st || 0, b.st || 0), read: (a.read || b.read) ? 1 : 0, ses: Object.keys(ses).sort().map(d => ses[d]).slice(-8)};
  });
  keys(L.gi, R.gi).forEach(k => { M.gi[k] = Math.max(L.gi[k] || 0, R.gi[k] || 0); });
  keys(L.ba, R.ba).forEach(k => {
    const a = L.ba[k] || {}, b = R.ba[k] || {};
    M.ba[k] = {best: Math.max(a.best || 0, b.best || 0), n: Math.max(a.n || 0, b.n || 0), last: Math.max(a.last || 0, b.last || 0)};

}

// ---------- Zweiter Speicher auf dem Gerät (IndexedDB) ----------
// Gleiche Schnittstelle wie die Artifact-Datenbank, damit Laden, Zusammenführen und Schreiben denselben geprüften Weg nehmen.
function idbCol() {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const rq = indexedDB.open('rumbo-sur', 1);
    rq.onupgradeneeded = () => { rq.result.createObjectStore('kv'); };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej({code: 'idb'}); rq.onblocked = () => rej({code: 'idb'});
  }));
  const run = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction('kv', mode), rq = fn(t.objectStore('kv'));
    t.oncomplete = () => res(rq ? rq.result : undefined);
    t.onerror = () => rej({code: 'idb'}); t.onabort = () => rej({code: 'idb'});
  }));
  return {doc: id => ({
    get: () => run('readonly', st => st.get(id)).then(v => ({exists: v !== undefined && v !== null, data: () => v})),
    set: v => run('readwrite', st => st.put(v, id))
  })};
}

// ---------- Abgleich: Artifact-Datenbank (im Claude-Konto) oder Zweitspeicher auf dem Gerät ----------
function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({code: 'timeout'}), ms))]); }
let onSync = () => {}, onRemoteState = () => {};
const Cloud = {
  col: null, kind: 'cloud', status: 'local', pushing: false, t: null, firstDirty: 0, err: '',
  async init() {
    const w = typeof window !== 'undefined' ? window : null;
    if (!w) { this.status = 'local'; return; }
    this.status = 'loading'; onSync();
    if (BUILD !== 'artifact') {
      // Eigenständige App: kein Konto, dafür ein zweiter Speicher auf dem Gerät
      this.kind = 'device';
      try {
        if (!w.indexedDB) throw {code: 'idb'};
        this.col = idbCol();
        await this.pull();
        if (this.status === 'error') throw {code: this.err};
      } catch (e) { this.col = null; this.status = 'local'; this.err = (e && e.code) || 'idb'; onSync(); }
      return;
    }
    // Die Artifact-Umgebung stellt window.claude bereit; kurz warten, falls sie einen Moment später kommt
    for (let i = 0; i < 8 && !(w.claude && typeof w.claude.use === 'function'); i++) await new Promise(r => setTimeout(r, 250));
    if (!w.claude || typeof w.claude.use !== 'function') { this.status = 'local'; onSync(); return; }
    try {
      const got = await Promise.all([w.claude.use('db'), w.claude.use('user')]);
      const db = got[0], user = got[1];
      if (!db || !user) { this.status = 'local'; onSync(); return; }
      const uid = await user.id();
      if (!uid) { this.status = 'local'; onSync(); return; }
      this.col = db.collection('data/users/' + uid);
      await this.pull();
    } catch (e) { this.status = 'error'; this.err = (e && e.code) || 'fehler'; onSync(); }
  },
  async pull() {
    if (!this.col) return;
    try {
      const m = await withTimeout(this.col.doc('meta').get(), 12000);
      if (!m.exists) {
        if (S.at > 0) { PARTS.forEach(p => Store.dirty.add(p)); await this.push(); }
        else { this.status = 'ok'; onSync(); }
        return;
      }
      const rt = (m.data() || {}).t || 0;
      if (rt === Store.syncedAt) { this.status = 'ok'; onSync(); if (Store.dirty.size) await this.push(); return; }
      const snaps = await Promise.all(PARTS.map(p => withTimeout(this.col.doc(p).get(), 15000)));
      const R = freshState(); R.at = rt;
      snaps.forEach((sn, i) => {
        if (!sn.exists) return;
        let d; try { d = JSON.parse((sn.data() || {}).s || '{}'); } catch (e) { return; }
        const p = PARTS[i];
        if (p === 'core') ['set', 'gr', 'gi', 'ba', 'li', 'ad', 'pri', 'created', 'at'].forEach(k => { if (d[k] !== undefined) R[k] = d[k]; });

        S = mergeStates(S, remote);
        PARTS.forEach(p => Store.dirty.add(p));
        Store.syncedAt = rt; Store.saveLocal();
        onRemoteState();
        await this.push();
      } else {
        S = remote; Store.syncedAt = rt; Store.dirty.clear(); Store.saveLocal();
        this.status = 'ok'; onSync(); onRemoteState();
      }
    } catch (e) { this.status = 'error'; this.err = (e && e.code) || 'fehler'; onSync(); }
  },
  schedule() {

    clearTimeout(this.t);
    const quick = this.kind === 'device';                       // auf dem Gerät sofort sichern, im Konto gebündelt
    this.t = setTimeout(() => this.push(), Math.max(0, Math.min(quick ? 1200 : 20000, this.firstDirty + (quick ? 4000 : 60000) - n)));
  },
  async push() {
    if (!this.col || this.pushing || !Store.dirty.size) return;
    this.pushing = true; this.status = 'saving'; onSync();
    clearTimeout(this.t); this.firstDirty = 0;
    // Hat ein anderes Gerät inzwischen gespeichert? Dann erst holen und zusammenführen, nie blind überschreiben.
    try {
      const m = await withTimeout(this.col.doc('meta').get(), 12000);
      if (m.exists && ((m.data() || {}).t || 0) !== Store.syncedAt) { this.pushing = false; await this.pull(); return; }
    } catch (e) { this.pushing = false; this.status = 'error'; this.err = (e && e.code) || 'fehler'; onSync(); return; }

      try { await withTimeout(this.col.doc(p).set({t: stamp, s: JSON.stringify(partData(p))}), 20000); }
      catch (e) { Store.dirty.add(p); failed = true; this.err = (e && e.code) || 'fehler'; break; }
    }

      try { await withTimeout(this.col.doc('meta').set({t: stamp, v: 1}), 15000); Store.syncedAt = stamp; }
      catch (e) { failed = true; this.err = (e && e.code) || 'fehler'; parts.forEach(p => Store.dirty.add(p)); }
    }
    this.pushing = false;
    this.status = failed ? 'error' : 'ok';

    if (!failed && Store.dirty.size) this.schedule();
  }

// Sprachlogik: Antworten prüfen, Verbformen, Zahlen, Uhrzeit.
function norm(s) {
  return String(s || '').toLowerCase().replace(/[¿?¡!.,;:«»"“”„()]/g, ' ').replace(/\s+/g, ' ').trim();
}
const COMBINING = new RegExp('[' + String.fromCharCode(0x300) + '-' + String.fromCharCode(0x36f) + ']', 'g');
const unaccent = s => norm(s).normalize('NFD').replace(COMBINING, '');
// 2 = richtig, 1 = richtig bis auf Akzente, 0 = falsch
function checkAnswer(input, answers) {
  const a = norm(input); if (!a) return 0;
  const list = [].concat(answers);
  if (list.some(x => norm(x) === a)) return 2;
  const u = unaccent(input);
  if (list.some(x => unaccent(x) === u)) return 1;
  return 0;
}

// ---------- Verben ----------
const PERSONS = ['yo', 'tú', 'él, ella, usted', 'nosotros', 'vosotros', 'ellos, ustedes'];
const PERSON_SHORT = ['yo', 'tú', 'él', 'nosotros', 'vosotros', 'ellos'];
const REFL = ['me', 'te', 'se', 'nos', 'os', 'se'];
const DRILL_PERSONS = [0, 1, 2, 3, 5];               // ohne vosotros
const TENSE = {
  pres: 'Presente', indef: 'Indefinido', imperf: 'Imperfecto', fut: 'Futuro', cond: 'Condicional',
  subj: 'Subjuntivo', perf: 'Perfecto', ger: 'Verlaufsform', ira: 'Nahe Zukunft', imp: 'Imperativo',
  vos: 'Presente (vos)', impvos: 'Imperativo (vos)'

// person: 0..5, oder 'vos'
function conjForm(verb, tense, person) {
  const sv = splitVerb(verb), d = CONJ[sv.base]; if (!d) return '';

    case 'pres': return pron + (person === 'vos' ? d.vos : d.pres[pi]);
    case 'vos': return pron + d.vos;
    case 'indef': case 'imperf': case 'fut': case 'cond': case 'subj': return pron + d[tense][pi];
    case 'perf': return pron + CONJ.haber.pres[pi] + ' ' + d.part;
    case 'ger': return pron + CONJ.estar.pres[pi] + ' ' + d.ger;
    case 'ira': return pron + CONJ.ir.pres[pi] + ' a ' + sv.base;
    case 'imp': return sv.refl ? '' : (pi === 1 ? d.imp[0] : pi === 2 ? d.imp[2] : pi === 5 ? d.imp[3] : '');

    ar: {pres: ['o', 'as', 'a', 'amos', 'áis', 'an'], indef: ['é', 'aste', 'ó', 'amos', 'asteis', 'aron'], part: 'ado', ger: 'ando'},
    er: {pres: ['o', 'es', 'e', 'emos', 'éis', 'en'], indef: ['í', 'iste', 'ió', 'imos', 'isteis', 'ieron'], part: 'ido', ger: 'iendo'},
    ir: {pres: ['o', 'es', 'e', 'imos', 'ís', 'en'], indef: ['í', 'iste', 'ió', 'imos', 'isteis', 'ieron'], part: 'ido', ger: 'iendo'}
  }[grp];
  const inf = st + grp;

}

const IMPERSONAL = {llover: 1};

  const sv = splitVerb(verb), d = CONJ[sv.base]; if (!d) return null;
  const r = regularForms(sv.base), out = [];
  const pr = [];
  if (IMPERSONAL[sv.base]) { if (d.pres[2] !== r.pres[2]) pr.push(d.pres[2] + ' (nur 3. Person)'); }
  else {
    if (d.pres[0] !== r.pres[0]) pr.push('yo ' + d.pres[0]);
    if (d.pres[1] !== r.pres[1]) pr.push('tú ' + d.pres[1]);
    else if (d.pres[2] !== r.pres[2]) pr.push('él ' + d.pres[2]);
  }
  if (pr.length) out.push(['Präsens', pr.join(', ')]);
  const ind = [];
  if (d.indef[0] !== r.indef[0]) ind.push('yo ' + d.indef[0]);
  if (d.indef[2] !== r.indef[2]) ind.push('él ' + d.indef[2]);
  if (ind.length) out.push(['Indefinido', ind.join(', ')]);
  if (d.fut[0] !== r.fut0) out.push(['Futuro', 'yo ' + d.fut[0]]);
  if (d.part !== r.part && unaccent(d.part) !== unaccent(r.part)) out.push(['Partizip', d.part]);
  if (d.ger !== r.ger) out.push(['Gerundio', d.ger]);
  return {grp: r.grp, parts: out, regular: out.length === 0};
}

// ---------- Zahlen ----------
const NUM_U = ['cero', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce', 'trece', 'catorce', 'quince', 'dieciséis', 'diecisiete', 'dieciocho', 'diecinueve', 'veinte', 'veintiuno', 'veintidós', 'veintitrés', 'veinticuatro', 'veinticinco', 'veintiséis', 'veintisiete', 'veintiocho', 'veintinueve'];
const NUM_T = ['', '', '', 'treinta', 'cuarenta', 'cincuenta', 'sesenta', 'setenta', 'ochenta', 'noventa'];
const NUM_H = ['', 'ciento', 'doscientos', 'trescientos', 'cuatrocientos', 'quinientos', 'seiscientos', 'setecientos', 'ochocientos', 'novecientos'];
function numBelow1000(x) {
  if (x === 100) return 'cien';
  const out = [], h = Math.floor(x / 100), r = x % 100;
  if (h) out.push(NUM_H[h]);
  if (r) { if (r < 30) out.push(NUM_U[r]); else { const t = Math.floor(r / 10), u = r % 10; out.push(NUM_T[t] + (u ? ' y ' + NUM_U[u] : '')); } }
  return out.join(' ');
}
function numEs(n) {
  n = Math.floor(n);
  if (n < 1000) return n === 0 ? 'cero' : numBelow1000(n);
  if (n < 1000000) {
    const th = Math.floor(n / 1000), r = n % 1000;
    const pre = th === 1 ? 'mil' : numBelow1000(th).replace(/veintiuno$/, 'veintiún').replace(/uno$/, 'un') + ' mil';
    return pre + (r ? ' ' + numBelow1000(r) : '');
  }
  const m = Math.floor(n / 1000000), r = n % 1000000;
  return (m === 1 ? 'un millón' : numEs(m).replace(/veintiuno$/, 'veintiún').replace(/uno$/, 'un') + ' millones') + (r ? ' ' + numEs(r) : '');
}
const fmtNum = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

// ---------- Uhrzeit ----------
function timeEs(h, m) {
  const hour = x => { const k = ((x + 11) % 12) + 1; return k === 1 ? 'la una' : 'las ' + NUM_U[k]; };
  const verb = x => (((x + 11) % 12) + 1 === 1 ? 'Es ' : 'Son ');
  if (m === 0) return verb(h) + hour(h) + '.';
  if (m === 15) return verb(h) + hour(h) + ' y cuarto.';
  if (m === 30) return verb(h) + hour(h) + ' y media.';
  if (m === 45) return verb(h + 1) + hour(h + 1) + ' menos cuarto.';
  if (m < 30) return verb(h) + hour(h) + ' y ' + numEs(m) + '.';
  return verb(h + 1) + hour(h + 1) + ' menos ' + numEs(60 - m) + '.';
}

{
  id: 'g07', title: 'Reflexive Verben', sub: 'me levanto, me quedo, me voy', phase: 2,
  body: [
    {p: 'Reflexive Verben tragen im Infinitiv ein <b>-se</b>: levantarse, quedarse. Beim Konjugieren wandert das Pronomen vor das Verb: <b>me, te, se, nos, se</b>.'},
    {conj: {t: 'pres', v: ['levantarse', 'quedarse', 'irse']}},
    {ul: [
      'Beim Infinitiv darf das Pronomen hinten dran: Voy a <b>ducharme</b>. Oder vorn: <b>Me</b> voy a duchar.',
      'Einige wechseln zusätzlich den Stamm: despertarse (me despierto), acostarse (me acuesto), sentarse (me siento), sentirse (me siento), divertirse (me divierto).'
    ]},
    {grid: {head: ['ohne se', 'mit se'], rows: [
      ['ir = gehen', 'irse = weggehen'],
      ['quedar = liegen, übrig sein', 'quedarse = bleiben'],
      ['llamar = rufen', 'llamarse = heißen'],
      ['dormir = schlafen', 'dormirse = einschlafen'],
      ['poner = stellen', 'ponerse = anziehen']
    ]}},
    {ex: [
      ['Me quedo tres noches.', 'Ich bleibe drei Nächte.'],
      ['¿A qué hora te levantas?', 'Wann stehst du auf?'],
      ['Nos vamos mañana.', 'Wir reisen morgen ab.'],
      ['¿Cómo se llama este lugar?', 'Wie heißt dieser Ort?']
    ]}
  ],
  drill: {

},
{
  id: 'g08', title: 'Indefinido: regelmäßige Verben', sub: 'Abgeschlossene Vergangenheit', phase: 2,
  body: [
    {p: 'Das <b>Indefinido</b> erzählt, was passiert ist und vorbei ist: gestern, letzte Woche, vor zwei Tagen. In Lateinamerika nimmt man es auch für heute: Hoy comí ceviche.'},
    {conj: {t: 'indef', v: ['hablar', 'comer', 'vivir']}},
    {ul: [
      'Der Akzent trägt die Bedeutung: <b>hablo</b> = ich spreche, <b>habló</b> = er sprach.',
      'nosotros ist bei -ar und -ir gleich wie im Präsens: hablamos, vivimos.',
      'Schreibung in der yo-Form: -car → <b>-qué</b> (busqué), -gar → <b>-gué</b> (llegué, pagué), -zar → <b>-cé</b> (empecé).',
      'Vokal vor der Endung: i wird zu y. leer → leyó, leyeron. Ebenso creer, caer, oír.',
      'Stammwechsler auf -ir ändern nur die 3. Person: pidió, pidieron; durmió, durmieron; sintió.'
    ]},
    {grid: {head: ['Signalwörter'], rows: [['ayer, anoche, anteayer, la semana pasada, el año pasado, hace dos días, en 2024, de repente']]}},
    {ex: [
      ['Ayer llegué a San José.', 'Gestern bin ich in San José angekommen.'],
      ['¿Qué comiste?', 'Was hast du gegessen?'],
      ['Salimos a las siete.', 'Wir sind um sieben losgegangen.'],
      ['Durmió muy mal.', 'Er hat sehr schlecht geschlafen.']
    ]}
  ],
  drill: {
    conj: [{t: 'indef', v: ['hablar', 'viajar', 'comprar', 'tomar', 'llegar', 'buscar', 'pagar', 'empezar', 'comer', 'beber', 'aprender', 'perder', 'volver', 'salir', 'vivir', 'escribir', 'abrir', 'conocer', 'leer', 'pedir', 'dormir', 'sentir']}],
    items: [
      ['s', 'Gestern bin ich angekommen.', 'Llegué ayer.'],
      ['s', 'Wir haben viel gegessen.', 'Comimos mucho.'],
      ['s', 'Hast du das Ticket gekauft?', '¿Compraste el boleto?'],
      ['s', 'Ich habe den Bus verpasst.', 'Perdí el bus.']
    ]
  }
},

{

  body: [
    {p: 'Das <b>Imperfecto</b> malt den Hintergrund: Beschreibungen, Zustände und Gewohnheiten in der Vergangenheit. Es antwortet auf „Wie war es?“ und „Was tat man früher regelmäßig?“.'},

{
  id: 'g12', title: 'Objektpronomen', sub: 'lo, la, le, se lo', phase: 3,
  body: [
    {p: 'Pronomen ersetzen ein Nomen, das schon bekannt ist. <b>Direkt</b> (wen oder was?) und <b>indirekt</b> (wem?) unterscheiden sich nur in der 3. Person.'},
    {grid: {head: ['Person', 'direkt', 'indirekt'], rows: [
      ['mich, mir', 'me', 'me'], ['dich, dir', 'te', 'te'],
      ['ihn, sie, es / ihm, ihr, Ihnen', 'lo, la', 'le'],
      ['uns', 'nos', 'nos'], ['sie, euch / ihnen, euch', 'los, las', 'les']
    ]}},
    {ul: [
      'Stellung: <b>vor</b> dem konjugierten Verb. La tengo. Te llamo.',
      'Oder angehängt an Infinitiv, Gerundio und bejahten Imperativ: Voy a comprar<b>lo</b>. Dí<b>me</b>.',
      'Zwei Pronomen: erst indirekt, dann direkt. ¿<b>Me lo</b> das?',
      'le oder les vor lo, la wird zu <b>se</b>: Se lo doy (nicht: le lo doy).'
    ]},
    {ex: [
      ['¿Tienes la llave? —Sí, la tengo.', 'Hast du den Schlüssel? – Ja, ich habe ihn.'],
      ['Te llamo mañana.', 'Ich rufe dich morgen an.'],
      ['Le doy la propina al guía.', 'Ich gebe dem Guide das Trinkgeld.'],
      ['¿Me lo puedes explicar?', 'Kannst du es mir erklären?'],

// Karten, Wiederholungsplanung (FSRS), adaptives Tempo, Tagesplan.
const CONJ = DATA.conj;
const DECKS = DATA.decks.map(d => ({id: d.id, name: d.name, phase: d.phase, cards: []}));
const CARD_BY_ID = {};
const CARDS = DATA.cards.map((c, i) => {
  const o = {i: i, id: hashId(c[1]), deck: c[0], es: c[1], de: c[2], ex: c[3], exd: c[4], t: c[5], note: c[6], vk: c[7], rf: c[8]};
  DECKS[c[0]].cards.push(o); CARD_BY_ID[o.id] = o; return o;
});

// Reihenfolge, in der neue Karten kommen: vorgezogene Decks zuerst, dann Phase für Phase, innerhalb der Phase reihum
function introOrder() {
  const out = [], used = {};
  S.pri.forEach(did => { const d = DECKS.find(x => x.id === did); if (d) d.cards.forEach(c => { if (!used[c.id]) { out.push(c); used[c.id] = 1; } }); });
  for (let ph = 1; ph <= 4; ph++) {
    const ds = DECKS.filter(d => d.phase === ph);
    const max = ds.reduce((m, d) => Math.max(m, d.cards.length), 0);
    for (let i = 0; i < max; i++) ds.forEach(d => { const c = d.cards[i]; if (c && !used[c.id]) { out.push(c); used[c.id] = 1; } });
  }
  return out;
}

// ---------- FSRS ----------
let F = null;
function initFsrs() {
  const lib = typeof FSRS !== 'undefined' ? FSRS : null;
  if (!lib || !lib.fsrs) return false;
  F = lib.fsrs(lib.generatorParameters({request_retention: (typeof RET_OVERRIDE !== 'undefined' ? RET_OVERRIDE : 0.9), maximum_interval: 365, enable_fuzz: true, enable_short_term: true}));
  return true;
}
const toMin = ms => Math.round((ms - EP) / 6e4), fromMin = m => EP + m * 6e4;
// Kartenzustand kompakt: [state, due, last, stability, difficulty, elapsed, scheduled, steps, reps, lapses, flags]
function unpack(a) {
  return {state: a[0], due: new Date(fromMin(a[1])), last_review: a[2] ? new Date(fromMin(a[2])) : undefined, stability: a[3], difficulty: a[4],
    elapsed_days: a[5], scheduled_days: a[6], learning_steps: a[7], reps: a[8], lapses: a[9]};
}
function pack(c, flags) {
  return [c.state, toMin(+new Date(c.due)), c.last_review ? toMin(+new Date(c.last_review)) : 0, round(c.stability, 3), round(c.difficulty, 3),
    c.elapsed_days || 0, c.scheduled_days || 0, c.learning_steps || 0, c.reps || 0, c.lapses || 0, flags || 0];
}
const isLearning = a => a[0] === 1 || a[0] === 3;
const isDueReview = (a, td) => a[0] === 2 && dayIdx(fromMin(a[1])) <= td;

function effNpd() { return S.ad.pause === today() ? 0 : S.set.npd; }
// Rückrichtung (Deutsch→Spanisch): im Modus „core“ nur für Wendungen, Verben und kleine Wörter
function prodWanted(c) { const m = S.set.prod || 'core'; return !!c && (m === 'all' || (m === 'core' && (c.t === 'p' || c.t === 'v' || c.t === 'o'))); }
// Deutsch→Spanisch wird freigeschaltet, sobald die Karte in der anderen Richtung sitzt
function prodCandidates() {
  const out = [];
  for (const k in S.cards) {
    if (k.charAt(k.length - 1) === '~') continue;
    const a = S.cards[k];
    if (a[0] === 2 && a[6] >= 4 && !S.cards[k + '~'] && prodWanted(CARD_BY_ID[k])) out.push(k);
  }
  return out.sort((x, y) => S.cards[x][2] - S.cards[y][2]);
}
function dueCounts(t) {
  t = t || nowMs(); const td = dayIdx(t);
  let learn = 0, rev = 0, seenR = 0, seenP = 0, known = 0, mature = 0;
  for (const k in S.cards) {
    const a = S.cards[k], prod = k.charAt(k.length - 1) === '~';
    if (prod) seenP++; else { seenR++; if (a[10] & 1) known++; if (a[0] === 2 && a[3] >= 21) mature++; }
    if (isLearning(a)) learn++; else if (isDueReview(a, td)) rev++;
  }
  const d = dayRO(td), npd = effNpd(), unseen = Math.max(0, CARDS.length - seenR);
  return {learn: learn, rev: rev, seenR: seenR, seenP: seenP, known: known, mature: mature, unseen: unseen,
    newLeft: Math.max(0, Math.min(unseen, npd - d.n)), prodLeft: Math.max(0, Math.min(prodCandidates().length, npd - d.p))};
}

// ---------- Lernsitzung ----------
let Session = null;
function startSession() {
  const t = nowMs(), td = dayIdx(t), c = dueCounts(t);
  const revs = [];
  for (const k in S.cards) if (isDueReview(S.cards[k], td)) revs.push(k);
  shuffle(revs);
  const news = [], order = introOrder();
  for (let i = 0; i < order.length && news.length < c.newLeft; i++) if (!S.cards[order[i].id]) news.push(order[i].id);
  const prods = prodCandidates().slice(0, c.prodLeft).map(k => k + '~');
  const fresh = [];
  for (let i = 0; i < Math.max(news.length, prods.length); i++) { if (news[i]) fresh.push(news[i]); if (prods[i]) fresh.push(prods[i]); }
  const main = []; let fi = 0;
  revs.forEach((k, i) => { main.push(k); if ((i + 1) % 4 === 0 && fi < fresh.length) main.push(fresh[fi++]); });
  while (fi < fresh.length) main.push(fresh[fi++]);
  Session = {main: main, cur: null, shownAt: t, done: 0, again: 0, undo: null, total: main.length + c.learn};
  return Session;
}
function nextCard() {
  const t = nowMs(), td = dayIdx(t);
  let best = null, bestDue = Infinity;
  for (const k in S.cards) { const a = S.cards[k]; if (isLearning(a) && CARD_BY_ID[k.replace('~', '')]) { const due = fromMin(a[1]); if (due < bestDue) { best = k; bestDue = due; } } }
  if (best && bestDue <= t) return best;
  while (Session && Session.main.length) {
    const k = Session.main.shift(), a = S.cards[k];
    if (!a || isDueReview(a, td)) return k;
  }
  if (best && bestDue <= t + 20 * 6e4) return best;      // Lernkarten bis 20 Minuten vorziehen
  // Nachfüllen: übersprungene („kenne ich schon“) Karten verbrauchen das Tagespensum nicht
  if (Session && refillSession()) return nextCard();
  return null;
}
function refillSession() {
  const c = dueCounts(), add = [];
  if (c.newLeft > 0) { const order = introOrder(); for (let i = 0; i < order.length && add.length < c.newLeft; i++) if (!S.cards[order[i].id]) add.push(order[i].id); }
  prodCandidates().slice(0, c.prodLeft).forEach(k => add.push(k + '~'));
  Session.main = Session.main.concat(add);
  return add.length > 0;
}
function remainingCount() {
  if (!Session) return 0;
  let learn = 0; for (const k in S.cards) if (isLearning(S.cards[k])) learn++;
  return Session.main.length + learn + (Session.cur ? 1 : 0);
}
function snapshot(keys) {
  const td = today();
  return {cards: keys.map(k => [k, S.cards[k] ? S.cards[k].slice() : null]), dayKey: dayStr(td), day: Object.assign({}, dayRO(td)), had: !!S.days[dayStr(td)]};
}
function rateCard(key, rating) {
  if (!F) return;
  const t = nowMs(), prev = S.cards[key];
  const snap = snapshot([key]);
  const card = prev ? unpack(prev) : FSRS.createEmptyCard(new Date(t));
  const res = F.next(card, new Date(t), rating);
  S.cards[key] = pack(res.card, prev ? prev[10] : 0);
  const d = dayRW(dayIdx(t));
  d.r++;
  if (!prev) { if (key.charAt(key.length - 1) === '~') d.p++; else d.n++; }
  else if (prev[0] === 2) { d.rr++; if (rating > 1) d.ok++; }
  if (Session) {
    d.tc += Math.round(clamp((t - Session.shownAt) / 1000, 1, 60));
    Session.undo = snap; Session.done++; if (rating === 1) Session.again++;
  }
  touch(cardPart(key), 'days');
}
function markKnown(id) {
  const t = nowMs(), snap = snapshot([id, id + '~']);
  [['', 21, 20], ['~', 12, 18]].forEach(x => {
    if (x[0] && !prodWanted(CARD_BY_ID[id])) return;
    const days = x[1] + Math.floor(Math.random() * x[2]);
    S.cards[id + x[0]] = [2, toMin(t + days * DAY_MS), toMin(t), 40, 3.5, 0, days, 0, 1, 0, 1];
  });
  dayRW().k++;
  if (Session) { Session.undo = snap; Session.done++; }
  touch(cardPart(id), 'days');
}
function undoLast() {
  const u = Session && Session.undo; if (!u) return false;
  u.cards.forEach(x => { if (x[1]) S.cards[x[0]] = x[1]; else delete S.cards[x[0]]; });
  if (u.had) S.days[u.dayKey] = u.day; else delete S.days[u.dayKey];
  if (Session.cur) Session.main.unshift(Session.cur);
  Session.cur = null; Session.main.unshift(u.cards[0][0]); Session.undo = null; Session.done = Math.max(0, Session.done - 1);
  touch(cardPart(u.cards[0][0]), 'days');
  return true;
}
function fmtIv(ms) {
  const m = ms / 6e4;
  if (m < 1.5) return '1 Min';
  if (m < 60) return Math.round(m) + ' Min';
  if (m < 1440) return Math.round(m / 60) + ' Std';
  const d = m / 1440;
  if (d < 30) return Math.round(d) + (Math.round(d) === 1 ? ' Tag' : ' Tage');
  if (d < 365) return round(d / 30, 1).toString().replace('.', ',') + ' Mon';
  return round(d / 365, 1).toString().replace('.', ',') + ' J';
}
function previewIntervals(key) {
  if (!F) return ['', '', '', ''];
  const t = nowMs(), prev = S.cards[key], card = prev ? unpack(prev) : FSRS.createEmptyCard(new Date(t));
  const rec = F.repeat(card, new Date(t));
  return [1, 2, 3, 4].map(g => fmtIv(+new Date(rec[g].card.due) - t));
}
function cardStatus(id) {
  const a = S.cards[id];
  if (!a) return {label: 'neu', cls: 'new'};
  if (a[10] & 1) return {label: 'bekannt', cls: 'known'};
  if (isLearning(a)) return {label: 'lernt', cls: 'learn'};
  return a[3] >= 21 ? {label: 'sitzt', cls: 'mature'} : {label: 'jung', cls: 'young'};
}

  d.cards.forEach(c => { const a = S.cards[c.id]; if (a) { seen++; if (a[0] === 2 && a[3] >= 21) mature++; } });

// ---------- Adaptives Tempo ----------
const sumOf = (arr, f) => arr.reduce((s, x) => s + (x[f] || 0), 0);
function recentDays(n, span) {
  const td = today(), out = [];
  for (let i = td - 1; i >= td - (span || 10) && out.length < n; i--) { const d = S.days[dayStr(i)]; if (d && d.r > 0) out.push(d); }
  return out;
}
function retention(days) { const rr = sumOf(days, 'rr'); return rr >= 30 ? sumOf(days, 'ok') / rr : null; }
function setPace(npd, why) {
  npd = clamp(npd, 4, 20);
  if (npd === S.set.npd) return;
  const td = today();
  S.ad.hist.push([td, S.set.npd, npd, why]); if (S.ad.hist.length > 12) S.ad.hist.shift();
  S.set.npd = npd; S.set.at = nowMs(); S.ad.chg = td; S.ad.note = why;
}
const RET_TARGET = 0.9;
function defaultPace(budget) { return ({30: 6, 45: 9, 60: 11})[budget] || 9; }
// Einmal pro Tag: Tempo an Trefferquote und Zeitaufwand anpassen.
// Neue Karten erzeugen ihre Wiederholungen erst in den Folgewochen, deshalb wird erst nach drei Wochen und nur bei viel Luft erhöht.
function evalAdapt() {
  const td = today();
  if (S.ad.last === td) return false;
  S.ad.last = td; S.ad.pause = 0;
  const due = dueCounts().rev;
  if (S.set.auto) {
    const act = recentDays(5, 10), bud = (BUDGET[S.set.budget] || BUDGET[45]).cards, npd = S.set.npd;
    if (due > bud * 12) {
      S.ad.pause = td; S.ad.note = 'Heute keine neuen Karten: erst die ' + due + ' fälligen Wiederholungen abbauen.';
    } else if (act.length >= 3 && td - (S.ad.chg || 0) >= 3) {
      const ret = retention(act), avg = sumOf(act, 'tc') / act.length / 60;
      const pct = ret === null ? '' : Math.round(ret * 100) + ' %';
      const settled = td - parseDay(S.set.start) >= 21;
      if (avg > bud * 1.5) setPace(npd - 3, 'Die Karten dauern im Schnitt ' + Math.round(avg) + ' Min statt ' + bud + ': deutlich weniger neue Karten.');
      else if (avg > bud * 1.2) setPace(npd - 2, 'Die Karten dauern im Schnitt ' + Math.round(avg) + ' Min statt ' + bud + ': weniger neue Karten.');
      else if (ret !== null && ret < 0.8) setPace(npd - 2, 'Trefferquote ' + pct + ': weniger neue Karten, damit die alten sitzen.');
      else if (settled && ret !== null && ret >= 0.88 && avg < bud * 0.55) setPace(npd + 2, 'Trefferquote ' + pct + ' und nur ' + Math.round(avg) + ' Min pro Tag: mehr neue Karten.');
    }
  }
  touch('core');
  return true;
}

// ---------- Grammatik-Fortschritt ----------
const grSt = id => (S.gr[id] || {}).st || 0;
const GR_LABEL = ['neu', 'geübt', 'bestanden', 'gemeistert'];
function nextLesson() { return GRAMMAR.find(l => grSt(l.id) < 2) || null; }
function recordLesson(id, pct, n, mode) {
  const td = today(), g = S.gr[id] || (S.gr[id] = {st: 0, read: 1, ses: []});
  const same = g.ses.find(x => x[0] === td);
  if (same) { if (pct > same[1]) { same[1] = pct; same[2] = n; } } else g.ses.push([td, pct, n]);
  if (g.ses.length > 8) g.ses.shift();
  let msg;
  if (mode === 'test') {
    if (pct >= 90) { g.st = 3; g.skip = 1; msg = 'Einstufung bestanden: Die Lektion gilt als gemeistert.'; }
    else { g.st = Math.max(g.st, 1); msg = 'Diese Lektion lohnt sich für Dich. Lies die Tabelle und übe noch einmal.'; }
  } else {

function conjItems(lessonId, spec) {

    persons.forEach(p => {

function fixedItems(lesson) {

    const k = lesson.id + ':i' + i;
    if (it[0] === 'c') return {k: k, les: lesson.id, type: 'c', q: it[1], opts: it[2], ai: it[3], ex: it[4] || ''};

  arr.sort((a, b) => b.w - a.w);
  const out = [], verbs = {};
  for (let i = 0; i < arr.length && out.length < n; i++) {
    const it = arr[i].it;
    if (it.type === 'conj') { verbs[it.verb] = (verbs[it.verb] || 0) + 1; if (verbs[it.verb] > 2) continue; }
    out.push(it);

}
function buildLessonDrill(lesson, n) {
  const pool = lessonPool(lesson);
  const by = t => pool.filter(x => x.type === t);
  const conj = by('conj'), ch = by('c'), fill = by('f'), self = by('s');
  const nS = Math.min(self.length, Math.round(n * 0.17));
  const want = conj.length ? {f: Math.round(n * 0.35), c: Math.round(n * 0.2)} : {f: Math.round(n * 0.3), c: n};
  let main = sampleItems(fill, Math.min(fill.length, want.f));
  main = main.concat(sampleItems(ch, Math.min(ch.length, want.c, n - nS - main.length)));
  main = main.concat(sampleItems(conj, n - nS - main.length));
  // Auffüllen, falls eine Aufgabenart nicht genug hergibt
  const have = {}; main.forEach(x => { have[x.k] = 1; });
  [ch, fill, conj].forEach(src => { if (main.length < n - nS) shuffle(src.slice()).forEach(x => { if (main.length < n - nS && !have[x.k]) { have[x.k] = 1; main.push(x); } }); });

const TYPE_LABEL = {n: 'Nomen', v: 'Verb', a: 'Adjektiv', p: 'Wendung', o: 'Wort'};

function conjTable(spec) {
  const vs = spec.v.filter(hasVerb), t = spec.t;
  let rows;
  if (t === 'imp') rows = [['tú', v => conjForm(v, 'imp', 1)], ['usted', v => conjForm(v, 'imp', 2)], ['ustedes', v => conjForm(v, 'imp', 5)], ['no + tú', v => 'no ' + conjForm(v, 'subj', 1)]];
  else rows = [0, 1, 2, 3, 4, 5].map(p => [PERSONS[p], v => conjForm(v, t, p), p === 4]);
  const irr = (v, p, f) => { if (t !== 'pres' && t !== 'indef') return false; const sv = splitVerb(v); if (sv.refl) return false; const r = regularForms(sv.base); return r[t][p] !== f; };
  return '<div class="tw"><table class="conj"><caption>' + esc(TENSE[t] || t) + '</caption><thead><tr><th></th>' + vs.map(v => '<th>' + esc(v) + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map((r, ri) => '<tr' + (r[2] ? ' class="dim"' : '') + '><th>' + esc(r[0]) + '</th>' + vs.map(v => { const f = r[1](v); return '<td' + (t !== 'imp' && irr(v, ri, f) ? ' class="irr"' : '') + '>' + esc(f) + '</td>'; }).join('') + '</tr>').join('') +
    '</tbody></table></div>';
}
function blocks(body) {
  return body.map(b => {
    if (b.p) return '<p>' + b.p + '</p>';
    if (b.ul) return '<ul>' + b.ul.map(x => '<li>' + x + '</li>').join('') + '</ul>';
    if (b.tip) return '<aside class="tip">' + b.tip + '</aside>';
    if (b.conj) return conjTable(b.conj);
    if (b.grid) return '<div class="tw"><table class="grid"><thead><tr>' + b.grid.head.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' + b.grid.rows.map(r => '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
    if (b.ex) return '<ul class="exs">' + b.ex.map(e => '<li><span class="es">' + esc(e[0]) + '</span>' + spk(e[0]) + '<span class="de">' + esc(e[1]) + '</span></li>').join('') + '</ul>';
    return '';

}

function sunDial(p) {
  const n = 16, lit = Math.round(n * p);
  let rays = '';
  for (let i = 0; i < n; i++) {
    const a = (i / n) * 2 * Math.PI - Math.PI / 2, long = i % 2 === 0;
    const r1 = 41, r2 = long ? 56 : 50;
    rays += '<line class="ray' + (i < lit ? ' lit' : '') + '" x1="' + round(60 + r1 * Math.cos(a), 1) + '" y1="' + round(60 + r1 * Math.sin(a), 1) + '" x2="' + round(60 + r2 * Math.cos(a), 1) + '" y2="' + round(60 + r2 * Math.sin(a), 1) + '"/>';
  }
  return '<svg class="sun' + (p >= 1 ? ' full' : '') + '" viewBox="0 0 120 120" role="img" aria-label="Tagesfortschritt ' + Math.round(p * 100) + ' Prozent">' + rays +
    '<circle class="disc" cx="60" cy="60" r="33"/><circle class="arc" cx="60" cy="60" r="33" pathLength="100" stroke-dasharray="' + round(p * 100, 1) + ' 100" transform="rotate(-90 60 60)"/></svg>';
}

  let h = installHint() + '<section class="hero"><div class="dial">' + sunDial(p) + '<div class="dial-n"><b>' + pr.done + '</b><span>von ' + pr.total + ' Min</span></div></div>' +

    '<p class="chips"><span class="chip">Woche ' + pi.week + ' von ' + pi.weeks + '</span>' + (st > 0 ? '<span class="chip sunny">' + st + (st === 1 ? ' Tag' : ' Tage') + ' in Folge</span>' : '') + '</p></div></section>';

  return h;

ACT.startCards = () => {
  if (!F) { toast('Planer nicht geladen. Bitte Seite neu laden.'); return; }
  startSession(); View.stack = [];
  const k = nextCard();
  if (!k) { markCardsDone(); toast('Keine Karten fällig.'); render(); return; }
  Session.cur = k; Session.rev = false; Session.shownAt = nowMs();
  push('session');
};
function sessionAdvance() {
  const k = nextCard();
  if (!k) { endSession(); return; }
  Session.cur = k; Session.rev = false; Session.shownAt = nowMs(); render();
}
function endSession() {
  const dc = dueCounts(), left = dc.learn + dc.rev + dc.newLeft + dc.prodLeft;
  if (left === 0) markCardsDone();
  const done = Session ? Session.done : 0, again = Session ? Session.again : 0;
  Session = null; View.stack = [];
  flushLocal(); Cloud.push();
  push('sessionEnd', {done: done, again: again, left: left});
}

    '<p class="small muted">Ziel ist eine ausgewogene Mischung. Language Transfer zählt je zur Hälfte als Hören und Sprechen.</p></section>';
  h += '<section class="card"><h2>Grammatik</h2><p>' + pi.done + ' von ' + GRAMMAR.length + ' Lektionen bestanden, ' + GRAMMAR.filter(l => grSt(l.id) === 3).length + ' gemeistert.</p>' + bar(pi.done, GRAMMAR.length) +
    '<p class="small">Language Transfer: Lektion ' + S.li.lt + ' von ' + RES.lt.total + '. Hörniveau: ' + esc(RES.levels[clamp(S.li.level, 0, 2)].name) + '.</p></section>';
  h += '<section class="card"><h2>Tempo</h2><div class="setrow"><span>Automatisch anpassen</span><button class="toggle' + (S.set.auto ? ' on' : '') + '" data-a="toggleAuto" role="switch" aria-checked="' + S.set.auto + '"><i></i></button></div>' +
    '<div class="setrow"><span>Neue Karten pro Tag</span><span class="stepper"><button class="stepbtn" data-a="npd" data-d="-1" aria-label="Weniger">−</button><b>' + S.set.npd + '</b><button class="stepbtn" data-a="npd" data-d="1" aria-label="Mehr">+</button></span></div>' +
    (S.ad.hist.length ? '<ul class="hist">' + S.ad.hist.slice(-3).reverse().map(x => '<li><b>' + fmtShort(x[0]) + '</b> ' + x[1] + ' → ' + x[2] + ': ' + esc(x[3]) + '</li>').join('') + '</ul>' : '<p class="small muted">Noch keine Anpassung. Die App wertet Trefferquote und Kartenzeit der letzten Lerntage aus.</p>') + '</section>';
  h += '<section class="card"><h2>Einstellungen</h2><div class="setrow col"><span>Zeit pro Tag</span><div class="seg" role="group">' + [30, 45, 60].map(x => '<button data-a="setBudget" data-v="' + x + '" class="' + (S.set.budget === x ? 'on' : '') + '">' + x + ' Min</button>').join('') + '</div></div>' +
    '<div class="setrow"><label for="set-dep">Abflug</label><input class="inp narrow" type="date" id="set-dep" data-c="setDep" value="' + esc(S.set.dep) + '"></div>' +
    '<div class="setrow col"><span>Rückrichtung Deutsch → Spanisch</span><div class="seg" role="group">' + [['core', 'Kern'], ['all', 'Alle'], ['off', 'Aus']].map(x => '<button data-a="setProd" data-v="' + x[0] + '" class="' + ((S.set.prod || 'core') === x[0] ? 'on' : '') + '">' + x[1] + '</button>').join('') + '</div>' +
    '<p class="small muted">Kern: Wendungen, Verben und kleine Wörter übst Du in beide Richtungen, Nomen und Adjektive nur Spanisch → Deutsch. „Alle“ verdoppelt etwa die Kartenzeit.</p></div>' +
    '<div class="setrow speakonly"><span>Vorlesetempo</span><span class="stepper"><button class="stepbtn" data-a="rate2" data-d="-0.1" aria-label="Langsamer">−</button><b>' + String(round(S.set.rate || 0.9, 1)).replace('.', ',') + '</b><button class="stepbtn" data-a="rate2" data-d="0.1" aria-label="Schneller">+</button><button class="chipbtn" data-a="say" data-t="Hola, ¿cómo estás? Mañana vamos a la playa.">Test</button></span></div>' +
    '<p class="small muted nospeak">Auf diesem Gerät wurde keine spanische Stimme gefunden. Die Vorlese-Knöpfe sind deshalb ausgeblendet.</p></section>';
  h += '<section class="card"><h2>Sicherung</h2><p id="sync-line" class="small">' + syncText() + '</p><div class="row"><button class="btn ghost" data-a="export">Backup speichern</button><button class="btn ghost" data-a="importOpen">Backup laden</button></div>' +
    (BUILD !== 'artifact' ? '<p class="small muted">Das Backup ist eine kleine Datei mit Deinem Lernstand. Damit ziehst Du auf ein anderes Gerät um, zum Beispiel vom Handy auf den Laptop.</p>' : '') +
    (Device.installEvt ? '<button class="btn ghost" data-a="install">Als App installieren</button>' : '') +
    '<p class="small muted">Version ' + esc(VERSION) + '</p></section>';
  h += '<section class="card"><h2>So funktioniert die App</h2><details><summary>Karten</summary><p class="small">Jede Karte kommt wieder, kurz bevor Du sie vergessen würdest. Bewerte ehrlich: <b>Nochmal</b>, wenn Du es nicht wusstest. <b>Schwer</b>, wenn es lange gedauert hat. <b>Gut</b> ist der Normalfall. <b>Leicht</b> nur, wenn es sofort da war. Neue Karten, die Du sicher kennst, überspringst Du.</p></details>' +
    '<details><summary>Grammatik</summary><p class="small">Erst die Lektion mit der vollständigen Tabelle lesen, dann üben. Ab 80 % ist eine Lektion bestanden und die nächste dran. Zwei starke Durchgänge an verschiedenen Tagen machen sie zu gemeistert. Mit dem Einstufungstest überspringst Du, was Du schon kannst.</p></details>' +
    '<details><summary>Wochenplan</summary><p class="small">Karten täglich. Montag, Mittwoch, Freitag: Grammatik und Language Transfer. Dienstag, Donnerstag: Hören und Sprechen. Samstag: langer Hörblock und gemischter Drill. Sonntag: nur Karten.</p></details>' +
    '<details><summary>Warum so?</summary><p class="small">Die Mischung folgt den vier Strängen nach Paul Nation: verstehen, sprechen, bewusst lernen, flüssig werden. Die Karten nutzen den Algorithmus FSRS. Die Wortauswahl stützt sich auf eine Häufigkeitsliste aus Film-Untertiteln: Die Karten decken 92 % der 500 häufigsten spanischen Wörter ab.</p></details></section>';
  h += '<section class="card"><h2>Zurücksetzen</h2><p class="small">Löscht den gesamten Lernstand ' + (BUILD === 'artifact' ? 'auf allen Geräten' : 'auf diesem Gerät') + '.</p><button class="btn danger" data-a="resetOpen">Alles zurücksetzen</button></section>';
  return h;
};
function syncText() {
  const st = Cloud.status;
  if (BUILD !== 'artifact') {
    const bk = Device.lastBackup(), bkT = bk ? ' Letztes Backup: ' + fmtShort(dayIdx(bk)) : ' Noch kein Backup gespeichert.';
    if (!Store.works) return 'Dieser Browser erlaubt kein Speichern. Lege ein Backup an, bevor Du die App schließt.';
    if (Device.needsInstall()) return 'Dein Fortschritt liegt vorerst im Safari-Speicher. Füg die App zum Home-Bildschirm hinzu, damit er dauerhaft bleibt.' + bkT;
    return 'Dein Fortschritt ist auf diesem Gerät gespeichert' + (Cloud.col ? ', doppelt abgelegt' : '') + (Device.persisted ? ' und vor automatischem Löschen geschützt' : '') + '.' + bkT;
  }
  if (st === 'ok') return 'Dein Fortschritt ist in Deinem Claude-Konto gespeichert und auf allen Geräten verfügbar.';
  if (st === 'saving') return 'Fortschritt wird gespeichert.';
  if (st === 'loading') return 'Fortschritt wird geladen.';
  if (st === 'error') return 'Der Abgleich hat gerade nicht geklappt. Dein Fortschritt liegt auf diesem Gerät und wird beim nächsten Versuch übertragen.';
  return Store.works ? 'Dein Fortschritt liegt nur in diesem Browser. Speichere ab und zu ein Backup.' : 'Dieser Browser erlaubt kein Speichern. Lege ein Backup an, bevor Du die Seite schließt.';
}
ACT.toggleAuto = () => { S.set.auto = !S.set.auto; S.set.at = nowMs(); if (!S.set.auto) S.ad.note = ''; touch('core'); rerender(); };
ACT.npd = el => { const v = clamp(S.set.npd + (+el.dataset.d), 2, 30); if (v !== S.set.npd) { S.set.npd = v; S.set.at = nowMs(); S.ad.chg = today(); S.ad.note = ''; touch('core'); rerender(); } };
ACT.setProd = el => { S.set.prod = el.dataset.v; S.set.at = nowMs(); touch('core'); rerender(); };
ACT.rate2 = el => { S.set.rate = clamp(round((S.set.rate || 0.9) + (+el.dataset.d), 1), 0.7, 1.3); S.set.at = nowMs(); touch('core'); rerender(); };
ACT.setDep = el => { if (el.value) { S.set.dep = el.value; S.set.at = nowMs(); touch('core'); rerender(); } };
ACT.install = async () => { const e = Device.installEvt; if (!e) return; try { e.prompt(); await e.userChoice; } catch (x) {} Device.installEvt = null; rerender(); };
ACT.export = async () => {
  const data = exportState();
  if (BUILD !== 'artifact') {
    const base = 'spanisch-backup-' + dayStr(today()), done = () => { Device.markBackup(); toast('Backup gespeichert'); if (!inFocusMode()) rerender(); };
    // Handy: Teilen-Menü, dort „In Dateien sichern“. Sonst normaler Download.
    try {
      if (navigator.canShare && window.matchMedia('(pointer: coarse)').matches) {
        const files = [new File([data], base + '.json', {type: 'application/json'}), new File([data], base + '.txt', {type: 'text/plain'})];
        for (let i = 0; i < files.length; i++) {
          if (navigator.canShare({files: [files[i]]})) { await navigator.share({files: [files[i]], title: 'Spanisch-Backup'}); done(); return; }
        }
      }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type: 'application/json'})); a.download = base + '.json';
      document.body.appendChild(a); a.click(); a.remove(); done(); return;
    } catch (e) {}
    copyText(data, 'Backup in die Zwischenablage kopiert'); return;
  }
  const name = 'rumbo-sur-backup-' + dayStr(today()) + '.json';
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({filename: name, data: data}); toast('Backup gespeichert'); return; }
  } catch (e) { if (e && e.code === 'declined') return; }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type: 'application/json'})); a.download = name;
    if (!window.claude) { document.body.appendChild(a); a.click(); a.remove(); toast('Backup gespeichert'); return; }
  } catch (e) {}
  copyText(data, 'Backup in die Zwischenablage kopiert');
};
ACT.importOpen = () => openSheet('<h2>Backup laden</h2><p class="small">Wähle die Backup-Datei aus oder füg ihren Inhalt ein. Der jetzige Stand wird ersetzt.</p><input class="inp" type="file" id="imp-file" accept=".json,.txt,application/json,text/plain" data-c="impFile">' +
  '<textarea class="ta" id="imp-ta" rows="5" placeholder="Oder Inhalt hier einfügen"></textarea><div class="row"><button class="btn ghost" data-a="closeSheet">Abbrechen</button><button class="btn" data-a="importDo">Laden</button></div>');
ACT.impFile = el => { const f = el.files && el.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#imp-ta').value = String(r.result || ''); }; r.readAsText(f); };
ACT.importDo = () => { const err = importState($('#imp-ta').value.trim()); if (err) { toast(err); return; } closeSheet(); toast('Backup geladen'); Cloud.push(); go('heute'); };
ACT.resetOpen = () => openSheet('<h2>Wirklich alles löschen?</h2><p class="small">Karten, Grammatik und Protokoll werden gelöscht. Tipp vorher auf „Backup speichern“, falls Du unsicher bist.</p><div class="row"><button class="btn ghost" data-a="closeSheet">Abbrechen</button><button class="btn danger" data-a="resetDo">Ja, löschen</button></div>');
ACT.resetDo = () => { Store.backup(); S = freshState(); touch.apply(null, PARTS); flushLocal(); Cloud.push(); closeSheet(); go('heute'); };

// ---------- Ereignisse und Start ----------
document.addEventListener('click', e => {
  const el = e.target.closest ? e.target.closest('[data-a]') : null;
  if (!el || el.disabled) return;
  const f = ACT[el.dataset.a]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.i; if (k && ACT[k]) ACT[k](e.target); });
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.c; if (k && ACT[k]) ACT[k](e.target); });
document.addEventListener('submit', e => { e.preventDefault(); if (Drill) { if (Drill.answered === null) ACT.check(); else ACT.drillNext(); } });
document.addEventListener('keydown', e => {
  const top = View.stack[View.stack.length - 1], tag = (e.target.tagName || '').toLowerCase();
  if (e.key === 'Escape' && !$('#sheet').hidden) { closeSheet(); return; }
  if (!top || tag === 'input' || tag === 'textarea') return;
  if (top.name === 'session' && Session && Session.cur) {
    if (!Session.rev && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); ACT.reveal(); }
    else if (Session.rev && '1234'.indexOf(e.key) >= 0 && e.key.length === 1) { rateCard(Session.cur, +e.key); Session.cur = null; sessionAdvance(); }
  }
});
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (TABS[t] && t !== View.tab && !inFocusMode()) { View.tab = t; View.stack = []; render(); } });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { flushLocal(); Cloud.push(); }
  else { if (evalAdapt() && !inFocusMode()) rerender(); if (Cloud.col && !Store.dirty.size && !Cloud.pushing) Cloud.pull(); }
});
window.addEventListener('pagehide', () => flushLocal());

onSync = () => {
  const dot = $('#syncdot'); if (dot) { dot.className = 'sync ' + (Cloud.kind === 'device' ? (Store.works ? 'local' : 'error') : Cloud.status); dot.title = syncText(); }
  const l = $('#sync-line'); if (l) l.textContent = syncText();
  if (!S.set.onb && View.tab === 'heute' && !View.stack.length && $('.onb')) rerender();
};
onRemoteState = () => { evalAdapt(); if (!inFocusMode()) rerender(); else toast(Cloud.kind === 'device' ? 'Aktueller Stand geladen' : 'Fortschritt von einem anderen Gerät übernommen'); };

function boot() {
  const had = Store.load();
  const fs = initFsrs();
  const t = location.hash.slice(1); if (TABS[t]) View.tab = t;
  Device.init();
  Speech.init();
  const start = () => { evalAdapt(); render(); if (!fs) toast('Der Wiederholungsplaner konnte nicht geladen werden.'); };
  if (BUILD !== 'artifact') {
    // Eigenständige App: Fehlt der Hauptspeicher, erst im Zweitspeicher nachsehen, bevor bei null begonnen wird
    if (BUILD === 'pwa' && 'serviceWorker' in navigator && location.protocol !== 'file:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
    if (had) { start(); Cloud.init(); if (S.set.onb) Device.persist(); return; }
    let started = false; const once = () => { if (!started) { started = true; start(); if (S.set.onb) Device.persist(); } };
    setTimeout(once, 2500);
    Cloud.init().then(once, once);
    return;
  }
  if (!had && window.claude && window.claude.use) {
    // Neues Gerät: kurz auf den gespeicherten Stand warten, damit nicht bei null begonnen wird
    $('#view').innerHTML = '<section class="pad center"><p class="muted">Dein Fortschritt wird geladen.</p></section>';
    let started = false; const once = () => { if (!started) { started = true; start(); } };
    const prev = onRemoteState; onRemoteState = () => { onRemoteState = prev; if (started) prev(); else once(); };
    setTimeout(once, 6000);
    Cloud.init().then(() => { onRemoteState = prev; once(); });
  } else { start(); Cloud.init(); }
}
boot();

})();
</script>
</body>
</html>
